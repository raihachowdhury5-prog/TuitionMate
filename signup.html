<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TuitionMate</title>
    <link rel="stylesheet" href="style.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"> 
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <div class="navbar">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="TuitionMate Logo">
                <span>TuitionMate</span>
            </a>

            <nav>
                <a href="index.html">Home</a>
                <a href="#">Courses</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
                <a href="login.html" class="login-btn">Login</a>
                <a href="signup.html" class="signup-btn">Sign Up</a>
            </nav>
        </div>
    </header>

    <!-- Sign Up Section -->
    <section class="login-section">

        <div class="login-card">

            <img src="images/logo.png"
                 alt="TuitionMate Logo"
                 class="login-logo">

            <h1>TuitionMate</h1>
            <p class="login-subtitle">Create your account</p>

           <form id="signupForm" autocomplete="on">
                <label for="name">Full Name</label>
                <input
    type="text"
    id="name"
    name="name"
    placeholder="Enter your full name"
    autocomplete="name"
    required
>
                <label for="email">Email Address</label>
                <input
    type="email"
    id="email"
    name="email"
    placeholder="Enter your email"
    autocomplete="email"
    required
>

                <label for="password">Password</label>
              <div class="password-box">
    <input
        type="password"
        id="password"
        name="password"
        placeholder="Create a password"
        autocomplete="new-password"
        required
    >
    <button type="button" class="show-password" onclick="togglePassword('password', this)">
        👁
    </button>
</div> 

                <label for="confirm-password">Confirm Password</label>
                 <div class="password-box">
    <input
        type="password"
        id="confirm-password"
        name="confirm-password"
        placeholder="Confirm your password"
        autocomplete="new-password"
        required
    >
    <button type="button" class="show-password" onclick="togglePassword('confirm-password', this)">
        👁
    </button>
</div>
                <button type="submit">Create Account</button>

            </form>

            <p class="signup-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-content">

            <div class="footer-brand">
                <img src="images/logo.png" alt="TuitionMate Logo">

                <div>
                    <h3>TuitionMate</h3>
                    <p>Learn Today, Lead Tomorrow</p>
                </div>
            </div>

            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="#">Courses</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>

            <div class="social-icons">
    <a href="#" aria-label="Facebook">
        <i class="fa-brands fa-facebook-f"></i>
    </a>

    <a href="#" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
    </a>

    <a href="#" aria-label="YouTube">
        <i class="fa-brands fa-youtube"></i>
    </a>
</div>
        </div>

        <div class="footer-bottom">
            © 2026 TuitionMate. All rights reserved.
        </div>
    </footer>
<script>
function togglePassword(id, button) {
    const password = document.getElementById(id);

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "🙈";
    } else {
        password.type = "password";
        button.textContent = "👁";
    }
}

document.getElementById("signupForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm-password").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    localStorage.setItem("tuitionmateUser", JSON.stringify({
        name: name,
        email: email,
        password: password
    }));

    alert("Account created successfully!");

    window.location.href = "login.html";
});
</script>
</body>
</html>
